# Relative paths below are resolved against root, not the current directory.
# root itself is relative to this settings file.
[paths]
root = ..
repo = TheNanotechnologyMolecularOptimizationBenchmark
work = nmo_fragnet_generation
reference = chemical_space_reference
run_dir = fragnet_combined_selected_stereo
fragnet_root = smiles_baseline2/FragNet
fragnet_python = ~/.conda/envs/fragnet/bin/python

# These are the existing launcher defaults. Command-line flags override them.
# Model, replay, genetic-search and fitness settings remain in run.py/build_config.
[run]
name = pilot_seed123
epochs = 6
calls = 256
steps = 10000
seed = 123
threads = 4
timeout = 1800
cpu = false
